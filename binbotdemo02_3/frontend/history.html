<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - BinBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css?v=20260307">
    <script src="js/toast.js"></script>
    <link rel="icon" href="favicon.png">
</head>
<body class="selection:bg-white/20 selection:text-white pb-20">

  <!-- Floating Navigation -->
  <nav class="fixed top-0 w-full z-50 nav-glass">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <div class="flex-shrink-0">
          <a href="dashboard.html" class="flex items-center gap-2 group">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-500/20 to-transparent border border-emerald-500/30 flex items-center justify-center transition-transform duration-300 group-hover:scale-105 shadow-[0_0_15px_rgba(16,185,129,0.15)]">
                <i data-lucide="leaf" class="w-4 h-4 text-emerald-400"></i>
            </div>
            <span class="font-bold tracking-tight text-white">BinBot</span>
          </a>
        </div>

        <div class="hidden md:block">
          <div class="flex items-baseline space-x-1">
            <a href="dashboard.html" class="mx-1 px-4 py-2 text-[#86868B] hover:text-white hover:bg-white/5 rounded-full text-xs font-semibold transition-all">
              Dashboard
            </a>
            <a href="classify.html" class="mx-1 px-4 py-2 text-[#86868B] hover:text-white hover:bg-white/5 rounded-full text-xs font-semibold transition-all">
              Classify
            </a>
            <a href="history.html" class="mx-1 px-4 py-2 bg-white/10 text-white rounded-full text-xs font-semibold shadow-inner border border-white/5 transition-all">
              History
            </a>
            <a href="analytics.html" class="mx-1 px-4 py-2 text-[#86868B] hover:text-white hover:bg-white/5 rounded-full text-xs font-semibold transition-all">
              Analytics
            </a>
            <a href="map.html" class="mx-1 px-4 py-2 text-[#86868B] hover:text-white hover:bg-white/5 rounded-full text-xs font-semibold transition-all">
              Map
            </a>
          </div>
        </div>

        <div class="hidden md:block">
            <a href="profile.html" id="profile-trigger-btn" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 transition-all flex items-center justify-center overflow-hidden border border-white/20 shrink-0">
                <i data-lucide="user" class="w-4 h-4 text-white"></i>
            </a>
        </div>
        
        <!-- Mobile Menu Button -->
        <div class="-mr-2 flex md:hidden">
          <button id="mobile-menu-btn" class="inline-flex items-center justify-center p-2 rounded-full text-[#86868B] hover:text-white hover:bg-white/10 focus:outline-none transition-all">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-[#111111] border-b border-white/10">
      <div class="px-4 pt-2 pb-4 space-y-1">
        <a href="dashboard.html" class="block px-4 py-3 rounded-2xl text-base font-medium text-[#86868B] hover:text-white hover:bg-white/5">Dashboard</a>
        <a href="classify.html" class="block px-4 py-3 rounded-2xl text-base font-medium text-[#86868B] hover:text-white hover:bg-white/5">Classify</a>
        <a href="history.html" class="block px-4 py-3 rounded-2xl text-base font-medium text-white bg-white/10">History</a>
        <a href="analytics.html" class="block px-4 py-3 rounded-2xl text-base font-medium text-[#86868B] hover:text-white hover:bg-white/5">Analytics</a>
        <a href="map.html" class="block px-4 py-3 rounded-2xl text-base font-medium text-[#86868B] hover:text-white hover:bg-white/5">Map</a>
        <a href="profile.html" class="block px-4 py-3 rounded-2xl text-base font-medium text-[#86868B] hover:text-white hover:bg-white/5">Profile</a>
        <button onclick="handleLogout()" class="w-full text-left px-4 py-3 rounded-2xl text-base font-medium text-red-400 hover:bg-white/5 mt-2">Sign out</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="pt-28 pb-16 px-4 max-w-7xl mx-auto relative z-10">
      
    <div class="mb-10 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>
            <h1 class="text-4xl font-black tracking-tight text-white mb-1">Scanning History</h1>
            <p class="text-[#86868B] font-medium text-sm">Review recently identified items and their system accuracy.</p>
        </div>
        <div class="flex gap-3">
            <button id="export-csv-btn" class="px-4 py-2 bg-[#1A1A1A] text-white border border-white/10 font-bold rounded-full text-xs hover:bg-[#2A2A2A] transition-colors flex items-center gap-2">
                <i data-lucide="download" class="w-4 h-4 text-[#86868B]"></i> Export CSV
            </button>
        </div>
    </div>

    <div class="bento-card overflow-hidden">
        <!-- Search and Filter Bar -->
        <div class="p-6 border-b border-white/5 flex flex-col md:flex-row items-center gap-4 justify-between bg-[#000000]/20">
            <div class="relative w-full md:w-96 group/search">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#86868B]">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </div>
                <input type="text" placeholder="Search by item name..." class="block w-full pl-10 pr-3 py-2.5 bg-[#1A1A1A] border border-white/10 rounded-xl text-sm text-white placeholder-[#86868B] focus:outline-none focus:ring-1 focus:ring-white/30 focus:border-white/30 transition-all">
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <select class="block w-full md:w-48 pl-3 pr-10 py-2.5 bg-[#1A1A1A] border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:ring-1 focus:ring-white/30 focus:border-white/30 appearance-none">
                    <option value="">All Categories</option>
                    <option value="recycle">Recycle</option>
                    <option value="compost">Compost</option>
                    <option value="trash">Trash</option>
                </select>
            </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse custom-table">
                <thead>
                    <tr class="text-xs font-bold text-[#86868B] uppercase tracking-widest bg-[#000000]/40">
                        <th class="px-6 py-4 rounded-tl-xl object-left w-2/5">Item Identified</th>
                        <th class="px-6 py-4 w-1/4">Assigned Bin</th>
                        <th class="px-6 py-4 w-1/5">AI Match</th>
                        <th class="px-6 py-4 rounded-tr-xl w-1/5 text-right">Time Logged</th>
                    </tr>
                </thead>
                <tbody id="history-table-body" class="text-sm">
                    <!-- Dynamic Rows Injected Here via JavaScript -->
                </tbody>
            </table>
        </div>
        
        <!-- Pagination -->
        <div class="px-6 py-4 border-t border-white/5 bg-[#000000]/20 flex items-center justify-between">
            <div class="text-xs text-[#86868B] font-medium">
                Showing top results
            </div>
            <div class="flex gap-2">
                <button class="px-3 py-1 border border-white/10 rounded-lg text-xs font-medium text-[#86868B] hover:text-white hover:border-white/30 transition-colors disabled:opacity-50" disabled>Previous</button>
                <button class="px-3 py-1 border border-white/10 rounded-lg text-xs font-medium text-[#86868B] hover:text-white hover:border-white/30 transition-colors">Next</button>
            </div>
        </div>
    </div>

  </div>

  <script type="module">
    import { auth, onAuthStateChanged, signOut, db } from './firebase-config.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    lucide.createIcons();

    const mobileBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if (mobileBtn && mobileMenu) {
        mobileBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    }

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "login.html";
        } else {
            // Render avatar dynamically
            const avatarContainer = document.getElementById("profile-trigger-btn");
            let gamifyStr = localStorage.getItem("binbot_user");
            let gamifyUser = gamifyStr ? JSON.parse(gamifyStr) : {};
            const finalAvatar = gamifyUser.avatar || user.photoURL;
            if(avatarContainer && finalAvatar && finalAvatar !== "null" && finalAvatar !== "undefined") {
                avatarContainer.innerHTML = `<img src="${finalAvatar}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<i data-lucide=\\'user\\' class=\\'w-4 h-4 text-white\\'></i>'; if(window.lucide) window.lucide.createIcons();" />`;
            }
            // Load history from Firebase for this user
            populateHistoryTable(user.uid);
        }
    });

    window.handleLogout = async function() {
        try {
            await signOut(auth);
            localStorage.removeItem("token");
            window.location.href = "login.html";
        } catch (error) {
            console.error("Logout Error:", error);
        }
    };

    // Render History Data - Fetches from Firebase first, falls back to localStorage
    let currentHistoryData = []; // Module-level store for CSV export

    async function populateHistoryTable(userId) {
        const tbody = document.getElementById("history-table-body");
        tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-[#86868B]"><i data-lucide="loader-2" class="w-6 h-6 mx-auto mb-2 animate-spin"></i><p>Loading history...</p></td></tr>`;
        lucide.createIcons();

        let historyData = [];
        try {
            const q = query(
                collection(db, "classifications"),
                where("userId", "==", userId)
            );
            const querySnapshot = await getDocs(q);
            querySnapshot.forEach((docSnap) => {
                historyData.push(docSnap.data());
            });
            // Sort client-side (newest first)
            historyData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        } catch (error) {
            console.warn("Firebase history fetch failed, falling back to localStorage:", error);
            historyData = JSON.parse(localStorage.getItem("binbot_history")) || [];
        }

        // If Firebase returned empty, also try localStorage as a secondary source
        if (historyData.length === 0) {
            historyData = JSON.parse(localStorage.getItem("binbot_history")) || [];
        }

        // Store for CSV export access
        currentHistoryData = historyData;

        tbody.innerHTML = "";

        if (historyData.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="px-6 py-8 text-center text-[#86868B]">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                        <p>No scanning history found yet. Go classify some items!</p>
                    </td>
                </tr>
            `;
            lucide.createIcons();
            return;
        }

        historyData.forEach(entry => {
            const row = document.createElement("tr");
            
            // Format standard date
            const d = new Date(entry.timestamp);
            const formattedTime = `${d.toLocaleString('default', { month: 'short' })} ${d.getDate()}, ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            
            let badgeBg = "bg-gray-500/10";
            let badgeBorder = "border-gray-500/20";
            let textCol = "text-gray-400";
            
            if (entry.color === "green") { badgeBg="bg-[#34C759]/10"; badgeBorder="border-[#34C759]/30"; textCol="text-[#34C759]"; }
            else if (entry.color === "blue") { badgeBg="bg-[#0071E3]/10"; badgeBorder="border-[#0071E3]/30"; textCol="text-[#0071E3]"; }
            else if (entry.color === "red") { badgeBg="bg-red-500/10"; badgeBorder="border-red-500/30"; textCol="text-red-500"; }
            else if (entry.color === "yellow") { badgeBg="bg-yellow-500/10"; badgeBorder="border-yellow-500/30"; textCol="text-yellow-500"; }
            else if (entry.color === "black") { badgeBg="bg-zinc-700/30"; badgeBorder="border-zinc-500/30"; textCol="text-zinc-300"; }

            row.innerHTML = `
                <td class="px-6 py-5 whitespace-nowrap border-b border-white/5">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center border border-white/10">
                            <i data-lucide="${entry.icon}" class="w-5 h-5 text-white/70"></i>
                        </div>
                        <span class="font-bold text-white tracking-wide capitalize truncate max-w-[200px]">${entry.item}</span>
                    </div>
                </td>
                <td class="px-6 py-5 whitespace-nowrap border-b border-white/5">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full ${badgeBg} border ${badgeBorder} text-xs font-bold ${textCol} capitalize">
                        ${entry.bin}
                    </span>
                </td>
                <td class="px-6 py-5 whitespace-nowrap text-white font-medium border-b border-white/5">${entry.matchScore}</td>
                <td class="px-6 py-5 whitespace-nowrap text-right text-[#86868B] font-medium text-xs border-b border-white/5">${formattedTime}</td>
            `;
            tbody.appendChild(row);
        });
        lucide.createIcons();
    }
    
    // Quick frontend filtering completely isolated in JS
    const filterDropdown = document.querySelector('select');
    const searchInput = document.querySelector('input[type="text"]');
    
    function applyFilters() {
        const searchTerm = searchInput.value.toLowerCase();
        const categoryFilter = filterDropdown.value.toLowerCase();
        
        const rows = document.querySelectorAll('#history-table-body tr');
        rows.forEach(row => {
            if(row.cells.length < 4) return; // Skip empty state
            const itemText = row.cells[0].textContent.toLowerCase();
            const binText = row.cells[1].textContent.toLowerCase();
            
            let matchesSearch = itemText.includes(searchTerm);
            let matchesCategory = categoryFilter === "" || binText.includes(categoryFilter);
            
            row.style.display = (matchesSearch && matchesCategory) ? '' : 'none';
        });
    }
    
    filterDropdown.addEventListener('change', applyFilters);
    searchInput.addEventListener('input', applyFilters);

    // --- Export CSV Functionality ---
    document.getElementById('export-csv-btn').addEventListener('click', () => {
        if (currentHistoryData.length === 0) {
            showToast('No history data to export!', 'warning');
            return;
        }

        // CSV Header
        let csvContent = 'Item,Bin,AI Match,Date\n';

        // CSV Rows
        currentHistoryData.forEach(entry => {
            const d = new Date(entry.timestamp);
            const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            // Escape commas in item names
            const item = `"${(entry.item || 'Unknown').replace(/"/g, '""')}"`;
            const bin = `"${(entry.bin || 'N/A').replace(/"/g, '""')}"`;
            const match = entry.matchScore || 'N/A';
            csvContent += `${item},${bin},${match},${dateStr}\n`;
        });

        // Create and trigger download
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'binbot_history.csv';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    });

  </script>

    
    <script>
        // Premium 3D Tilt Effect
        document.querySelectorAll('.bento-card, .glass-panel').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -4;
                const rotateY = ((x - centerX) / centerX) * 4;
                
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                card.style.transition = 'transform 0.1s ease';
                card.style.zIndex = '50';
                
                // Add metallic shine
                card.style.background = `radial-gradient(circle at ${x}px ${y}px, var(--tilt-shine-color) 0%, var(--tilt-base-color) 60%)`;
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
                card.style.transition = 'transform 0.5s ease-out';
                card.style.zIndex = '1';
                card.style.background = card.classList.contains('glass-panel') ? 'var(--glass-bg)' : 'var(--card-bg)';
            });
        });
    </script>
</body>

</html>
